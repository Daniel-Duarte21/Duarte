<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leitor automático de SKU</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
body{font-family:Arial,sans-serif;max-width:560px;margin:20px auto;padding:0 14px;color:#222}
button{font-size:16px;padding:12px 15px;border:0;border-radius:8px;margin:6px 6px 6px 0;cursor:pointer}
#start{background:#1769d2;color:white}#stop{background:#e8e8e8}#download{background:#16803c;color:white}
video{width:100%;background:#111;border-radius:10px;margin-top:12px}
.panel{background:#f2f4f7;padding:14px;border-radius:10px;margin-top:14px}
input{width:100%;font-size:25px;padding:10px;box-sizing:border-box;border:1px solid #aaa;border-radius:8px}
#status{font-weight:bold;margin-top:9px}.ok{color:#16803c}.bad{color:#b42318}
small{color:#666}
</style>
</head>
<body>
<h2>Leitor automático de SKU</h2>
<p>O leitor procura um SKU com 8 dígitos começando por <b>90</b>.</p>
<button id="start">Abrir câmera</button>
<button id="stop" disabled>Parar</button>
<button id="download">Baixar HTML</button>
<video id="video" autoplay muted playsinline></video>
<canvas id="canvas" hidden></canvas>
<div class="panel">
 <label for="sku"><b>SKU reconhecido</b></label>
 <input id="sku" placeholder="Aguardando leitura..." readonly>
 <div id="status">Aguardando câmera.</div>
</div>
<p><small>Para evitar leituras falsas, o mesmo SKU precisa aparecer com boa confiança em 3 leituras seguidas.</small></p>
<script>
const video=document.getElementById('video'),canvas=document.getElementById('canvas');
const sku=document.getElementById('sku'),status=document.getElementById('status');
const start=document.getElementById('start'),stop=document.getElementById('stop'),download=document.getElementById('download');
let stream=null,worker=null,busy=false,scanTimer=null;

download.onclick=()=>{
 const source='<!doctype html>\\n'+document.documentElement.outerHTML;
 const blob=new Blob([source],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob);
 const link=document.createElement('a');
 link.href=url;
 link.download='leitor_sku.html';
 document.body.appendChild(link);
 link.click();
 link.remove();
 setTimeout(()=>URL.revokeObjectURL(url),30000);
 status.textContent='Download solicitado. No iPhone, confira o app Arquivos > Downloads.';
 status.className='';
};
let previousCandidate='',repeatCount=0;

start.onclick=async()=>{
 try{
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
   throw new Error('O navegador bloqueou a câmera. Abra esta página por um endereço HTTPS.');
  }
  // Primeiro tenta a câmera traseira; se o aparelho não aceitar essa opção,
  // tenta abrir qualquer câmera disponível.
  try{
   stream=await navigator.mediaDevices.getUserMedia({
    video:{facingMode:{ideal:'environment'}},audio:false
   });
  }catch(firstError){
   stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});
  }
  video.srcObject=stream;
  video.muted=true;
  await video.play();
  start.disabled=true;stop.disabled=false;
  status.textContent='Preparando reconhecimento...';status.className='';
  if(!worker){
   worker=await Tesseract.createWorker('eng');
   await worker.setParameters({
    tessedit_char_whitelist:'0123456789',
    tessedit_pageseg_mode:'11'
   });
  }
  status.textContent='Procurando SKU...';
  automaticRead();
 }catch(e){status.textContent='Não abriu a câmera: '+e.message+'. No celular, abra pelo Chrome/Safari em HTTPS e permita o acesso à câmera.';
  status.className='bad';}
};

function getReliableCandidate(data){
 const words=(data.words||[]);
 const found=[];
 for(const word of words){
  const digits=(word.text||'').replace(/[^0-9]/g,'');
  // Aceita somente uma palavra reconhecida como exatamente 8 dígitos.
  if(/^90[0-9]{6}$/.test(digits) && word.confidence>=82){
   found.push({sku:digits,confidence:word.confidence});
  }
 }
 if(!found.length)return null;
 found.sort((a,b)=>b.confidence-a.confidence);
 return found[0].sku;
}

async function automaticRead(){
 if(!stream||busy)return;
 busy=true;
 try{
  const w=video.videoWidth,h=video.videoHeight;
  if(w&&h){
   const scale=Math.min(1,1100/w);
   canvas.width=Math.round(w*scale);canvas.height=Math.round(h*scale);
   const ctx=canvas.getContext('2d');
   ctx.drawImage(video,0,0,canvas.width,canvas.height);
   const result=await worker.recognize(canvas);
   const candidate=getReliableCandidate(result.data);
   if(candidate){
    if(candidate===previousCandidate)repeatCount++;
    else{previousCandidate=candidate;repeatCount=1;}
    status.textContent='Conferindo SKU... ('+repeatCount+'/2)';
    status.className='';
    if(repeatCount>=2){
     sku.value=candidate;
     status.textContent='SKU confirmado!';
     status.className='ok';
    }
   }else{
    previousCandidate='';repeatCount=0;
    status.textContent='Procurando um SKU válido...';
    status.className='';
   }
  }
 }catch(e){status.textContent='Falha no reconhecimento: '+e.message;status.className='bad';}
 finally{busy=false;if(stream)scanTimer=setTimeout(automaticRead,220);}
}

stop.onclick=()=>{
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
 if(scanTimer)clearTimeout(scanTimer);
 video.srcObject=null;start.disabled=false;stop.disabled=true;
 sku.value='';previousCandidate='';repeatCount=0;
 status.textContent='Câmera parada.';status.className='';
};
</script>
</body>
</html>
